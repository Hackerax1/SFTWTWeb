name: Build and deploy Node.js app to Azure Web App - SFTWT

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          git init
          git remote add origin https://github.com/${{ github.repository }}.git
          git -c http.extraheader="AUTHORIZATION: bearer ${{ github.token }}" fetch --depth=1 origin ${{ github.sha }}
          git checkout --force FETCH_HEAD

      - name: Verify Node.js and npm availability
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build and test
        run: |
          npm run build --if-present
          npm run test --if-present

      - name: Package app for deployment
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          zip -r app.zip . -x ".git/*" "app.zip"

      - name: Deploy to Azure Web App (Zip Deploy)
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B94F51A9C7A541BBA4E4255BB767260B }}
        run: |
          $publishData = [xml]$env:AZURE_WEBAPP_PUBLISH_PROFILE
          $profile = $publishData.publishData.publishProfile | Where-Object { $_.publishMethod -eq 'ZipDeploy' } | Select-Object -First 1
          if (-not $profile) {
            $profile = $publishData.publishData.publishProfile | Select-Object -First 1
          }

          if (-not $profile) {
            throw "Could not parse Azure publish profile from secret."
          }

          $deployUrl = $profile.publishUrl
          if ($deployUrl -notmatch '^https?://') {
            $deployUrl = "https://$deployUrl"
          }
          if ($deployUrl -notmatch '/api/zipdeploy$') {
            $deployUrl = "$deployUrl/api/zipdeploy"
          }

          $credentialPair = "$($profile.userName):$($profile.userPWD)"
          $bytes = [System.Text.Encoding]::ASCII.GetBytes($credentialPair)
          $basicAuth = [System.Convert]::ToBase64String($bytes)

          $deployParams = @{
            Uri = $deployUrl
            Method = "Post"
            Headers = @{ Authorization = "Basic $basicAuth" }
            InFile = "app.zip"
            ContentType = "application/zip"
          }

          Invoke-RestMethod @deployParams
